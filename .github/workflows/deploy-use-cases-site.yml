# WorkIt use cases site build and GitHub Pages deployment.
# Author: Admilson B. F. Cossa
# SPDX-License-Identifier: Apache-2.0

name: Use Cases Site

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/deploy-use-cases-site.yml"
      - "apps/use-cases-site/**"
      - "examples/ai-failure-lab/**"
      - "package.json"
      - "package-lock.json"
      - "packages/core/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-use-cases-site.yml"
      - "apps/use-cases-site/**"
      - "examples/ai-failure-lab/**"
      - "package.json"
      - "package-lock.json"
      - "packages/core/**"

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build use cases site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/use-cases-site/package-lock.json
            examples/ai-failure-lab/package-lock.json

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Install site dependencies
        run: npm ci --no-audit --no-fund
        working-directory: apps/use-cases-site

      - name: Install AI Failure Lab dependencies
        run: npm ci --no-audit --no-fund
        working-directory: examples/ai-failure-lab

      - name: Test site contracts
        run: npm test
        working-directory: apps/use-cases-site

      - name: Test AI Failure Lab decision parity
        run: npm test
        working-directory: examples/ai-failure-lab

      - name: Build site
        run: npm run build
        working-directory: apps/use-cases-site

      - name: Configure Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: apps/use-cases-site/dist

  deploy:
    name: Deploy use cases site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
