# Author: Admilson B. F. Cossa
# SPDX-License-Identifier: Apache-2.0

name: Nightly property tests

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: nightly-property-${{ github.ref }}
  cancel-in-progress: false

jobs:
  property-tests:
    name: 1,000 runs per property
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run deep property suite
        run: npm --workspace @workit/core run test:property -- --testTimeout=120000
        env:
          WORKIT_PROPERTY_RUNS: "1000"
          WORKIT_PROPERTY_SEED_OFFSET: ${{ github.run_number }}
